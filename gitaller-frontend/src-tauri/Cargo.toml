[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri-plugin-log = "2"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Agregados para previsualizar y descargar PDFs generados en el frontend:
# el webview de Tauri no soporta window.open() en pestaña nueva ni el
# flujo de descarga del navegador (<a download>), así que usamos estos
# plugins para escribir el archivo a disco y abrirlo con la app del
# sistema (fs + opener), o dejar elegir dónde guardarlo (dialog).
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Agregado para poder usar tokio::time::sleep en start_server (lib.rs).
# Tauri ya trae tokio como dependencia transitiva, así que esto no agrega
# peso real al binario, solo lo expone como dependencia directa.
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
